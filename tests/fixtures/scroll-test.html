<!DOCTYPE html>
<html>
<head>
<style>
  .modal {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .modal-body {
    width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    background: white;
    border: 1px solid #ccc;
  }
  .content {
    height: 2000px;
    padding: 20px;
  }
</style>
</head>
<body>
<div class="modal">
  <div class="modal-body">
    <div class="content">
      <p>This is a tall content area that should trigger scrolling in the modal body.</p>
    </div>
  </div>
</div>
</body>
</html>
