<!DOCTYPE html>
<html>
<head>
<style>
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    height: 60px;
    background: #333;
    color: white;
  }
  .main {
    flex: 1;
    display: flex;
    overflow: hidden;
  }
  .sidebar {
    width: 250px;
    background: #f0f0f0;
    overflow-y: auto;
  }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  .tall-content {
    height: 3000px;
  }
</style>
</head>
<body>
<div class="app">
  <div class="header">Header</div>
  <div class="main">
    <div class="sidebar">
      <div class="tall-content">Sidebar content (tall)</div>
    </div>
    <div class="content">
      <div class="tall-content">Main content (tall)</div>
    </div>
  </div>
</div>
</body>
</html>
